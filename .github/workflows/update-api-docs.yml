name: Update REAPER API Documentation

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write
  issues: write

# Never let two runs race each other while creating/closing PRs
concurrency:
  group: update-api-docs
  cancel-in-progress: false

env:
  LUA_FILE: luadoc/reaper-api.lua
  BRANCH_PREFIX: update-api-docs-

jobs:
  update-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: generator
        run: bun install

      - name: Generate API documentation
        working-directory: generator
        run: bun generate

      - name: Check for changes against main
        id: check_changes
        run: |
          if git diff --quiet -- "$LUA_FILE"; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected in $LUA_FILE"
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in $LUA_FILE"
          fi

      - name: Compare with open update PRs
        id: open_prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGES: ${{ steps.check_changes.outputs.changes }}
        run: |
          # All open PRs created by this workflow (identified by branch prefix),
          # newest first so the most recent matching PR is the one kept
          gh pr list --state open --base main --limit 500 \
            --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"$BRANCH_PREFIX\")) | \"\(.number) \(.headRefName)\"" \
            > open-prs.txt

          matching=""
          stale=""
          while read -r number branch; do
            [ -z "$number" ] && continue
            git fetch --quiet --depth=1 origin "+refs/heads/$branch:refs/remotes/origin/$branch" || {
              echo "Could not fetch $branch for PR #$number, treating it as stale"
              stale="$stale $number"
              continue
            }
            # Compare the PR's lua file with the freshly generated one (working tree)
            if [ "$CHANGES" != "true" ]; then
              echo "PR #$number ($branch) is obsolete: main is already up to date"
              stale="$stale $number"
            elif git diff --quiet "origin/$branch" -- "$LUA_FILE"; then
              if [ -z "$matching" ]; then
                echo "PR #$number ($branch) already contains these changes"
                matching="$number"
              else
                echo "PR #$number ($branch) duplicates PR #$matching"
                stale="$stale $number"
              fi
            else
              echo "PR #$number ($branch) is out of date"
              stale="$stale $number"
            fi
          done < open-prs.txt
          rm -f open-prs.txt

          echo "matching=$matching" >> "$GITHUB_OUTPUT"
          echo "stale=$(echo $stale)" >> "$GITHUB_OUTPUT"

      - name: Get current date
        if: steps.check_changes.outputs.changes == 'true' && steps.open_prs.outputs.matching == ''
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true' && steps.open_prs.outputs.matching == ''
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: ${{ env.LUA_FILE }}
          commit-message: "Update REAPER API documentation (${{ steps.date.outputs.date }})"
          title: "🤖 Update REAPER API Documentation - ${{ steps.date.outputs.date }}"
          body: |
            ## Automated REAPER API Documentation Update

            This PR was automatically generated by the GitHub workflow.

            ### Changes
            - Updated `luadoc/reaper-api.lua` with the latest REAPER API documentation
            - Generated from: https://www.reaper.fm/sdk/reascript/reascripthelp.html
            - Date: ${{ steps.date.outputs.date }}

            ### Summary
            The REAPER API documentation has been refreshed with any new functions, updated signatures, or improved descriptions from the official documentation.

            Any older open update PRs are closed automatically in favour of this one.

            Please review the changes and merge if they look correct.
          branch: ${{ env.BRANCH_PREFIX }}${{ steps.date.outputs.date }}
          delete-branch: true
          draft: false
          labels: |
            documentation
            automated
            api-update

      - name: Close superseded PRs
        if: steps.open_prs.outputs.stale != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STALE: ${{ steps.open_prs.outputs.stale }}
          CHANGES: ${{ steps.check_changes.outputs.changes }}
          MATCHING: ${{ steps.open_prs.outputs.matching }}
          NEW_PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          if [ "$CHANGES" != "true" ]; then
            reason="main already contains the latest generated REAPER API documentation, so this PR is no longer needed."
          elif [ -n "$NEW_PR" ]; then
            reason="Superseded by #$NEW_PR, which contains newer REAPER API documentation."
          elif [ -n "$MATCHING" ]; then
            reason="Superseded by #$MATCHING, which contains the latest REAPER API documentation."
          else
            echo "No replacement PR found; leaving PRs open: $STALE"
            exit 0
          fi

          for number in $STALE; do
            # Never close the PR that was just created or updated
            if [ "$number" = "$NEW_PR" ] || [ "$number" = "$MATCHING" ]; then
              continue
            fi
            echo "Closing PR #$number"
            gh pr close "$number" --delete-branch --comment "$reason"
          done

      - name: Summary
        env:
          CHANGES: ${{ steps.check_changes.outputs.changes }}
          MATCHING: ${{ steps.open_prs.outputs.matching }}
          NEW_PR: ${{ steps.cpr.outputs.pull-request-number }}
          OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
        run: |
          if [ "$CHANGES" != "true" ]; then
            echo "No API changes compared to main." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ -n "$MATCHING" ]; then
            echo "PR #$MATCHING already contains these changes; no new PR opened." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Pull request #$NEW_PR ($OPERATION) contains the latest API changes." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "When it is merged, a release is created automatically from the REAPER version in the lua file." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
